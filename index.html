<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mendur Cell Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; }
        .login-container { margin-top: 10%; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .btn-primary { background: #764ba2; border: none; border-radius: 25px; padding: 10px; }
        .btn-primary:hover { background: #5a3a7d; }
    </style>
</head>
<body>

<div class="container login-container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-mobile-alt fa-3x text-primary mb-3"></i>
                    <h4>Arthemis Celluler</h4>
                    <small class="text-muted">Inventory Management System</small>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" id="username" class="form-control" placeholder="Username">
                    </div>
                </div>
                <div class="mb-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="Password">
                    </div>
                </div>
                <button onclick="handleLogin()" class="btn btn-primary w-100">SIGN IN</button>
            </div>
        </div>
    </div>
</div>

<script>
    function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(u === 'Mendur' && p === '12345') {
            Swal.fire({ icon: 'success', title: 'Login Berhasil', showConfirmButton: false, timer: 1500 })
            .then(() => { window.location.href = 'dashboard.html'; });
        } else {
            Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Username atau Password salah!' });
        }
    }
</script>
</body>
</html>
