<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | Mendur Cell</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar { background: #2d3436; color: white; min-height: 100vh; }
        .nav-link { color: #dfe6e9; }
        .nav-link:hover { background: #4b4b4b; color: white; }
        .chart-container { position: relative; height: 40vh; width: 80vw; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar p-3">
            <h5 class="text-center mb-4 mt-2">Mendur Admin</h5>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link mb-2" href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link mb-2 active" href="#"><i class="fas fa-chart-line me-2"></i> Analytics</a></li>
                <li class="nav-item"><a class="nav-link mb-2" href="index.html"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
            </ul>
        </nav>

        <main class="col-md-10 p-4">
            <h2 class="mb-4">Laporan Penjualan Smartphone</h2>
            
            <div class="row">
                <div class="col-md-8">
                    <div class="card shadow-sm p-3 mb-4">
                        <h5 class="card-title">Tren Penjualan Bulanan</h5>
                        <canvas id="salesChart"></canvas>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm p-3 mb-4">
                        <h5 class="card-title">Dominasi Brand</h5>
                        <canvas id="brandChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    // Grafik Batang (Tren Penjualan)
    const ctxSales = document.getElementById('salesChart').getContext('2d');
    new Chart(ctxSales, {
        type: 'bar',
        data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr'],
            datasets: [{
                label: 'Unit Terjual',
                data: [12, 19, 15, 25],
                backgroundColor: '#764ba2'
            }]
        }
    });

    // Grafik Lingkaran (Brand)
    const ctxBrand = document.getElementById('brandChart').getContext('2d');
    new Chart(ctxBrand, {
        type: 'doughnut',
        data: {
            labels: ['Infinix', 'Samsung', 'Redmi', 'Lainnya'],
            datasets: [{
                data: [45, 30, 15, 10],
                backgroundColor: ['#667eea', '#764ba2', '#fab1a0', '#dfe6e9']
            }]
        }
    });
</script>
</body>
</html>
